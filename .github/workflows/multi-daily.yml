name: '[멀티] 무신사·올영 글로벌 랭킹 일일 수집'

# 기존 '올리브영 랭킹 일일 수집'과 별개 워크플로우. multi/ 폴더만 사용하고 rk_ 테이블에만 쓴다.
on:
  # 매일 오전 9시(KST) 실행은 Claude 예약 작업이 workflow_dispatch 로 호출한다.
  # GitHub schedule 은 지연이 커서 9시 실행이 빠진 날의 오후 대체 실행으로만 쓴다.
  schedule:
    - cron: '0 6 * * *'   # KST 15:00 — 대체 실행 (guard 가 오늘 9시 실행 여부 확인)
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  # 9시 예약 실행(workflow_dispatch)이 오늘 이미 돌았으면 오후 대체 실행은 건너뛴다.
  # 안 돌았으면 대체 실행하고, 9시 실행이 빠졌다는 알림 이슈를 연다.
  guard:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          TODAY=$(TZ=Asia/Seoul date +%Y-%m-%d)
          N=$(gh run list --workflow "multi-daily.yml" --event workflow_dispatch --limit 30 --json createdAt,status,conclusion \
            --jq "[.[] | select(((.createdAt | fromdateiso8601) + 32400 | strftime(\"%Y-%m-%d\")) == \"$TODAY\") | select(.conclusion == \"success\" or .status != \"completed\")] | length")
          if [ "$N" -gt 0 ]; then
            echo "오늘($TODAY) 9시 실행이 이미 있음 — 대체 실행 건너뜀"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "오늘($TODAY) 9시 실행이 없음 — 대체 실행"
            echo "run=true" >> "$GITHUB_OUTPUT"
            gh issue create --title "⚠️ ${{ github.workflow }}: 9시 실행 누락, 오후 대체 실행 ($TODAY)" \
              --body "오늘 오전 9시 예약 실행이 확인되지 않아 GitHub 예약으로 대체 실행했습니다. 이 날 데이터는 9시가 아닌 대체 실행 시각 기준입니다. 로그: $RUN_URL" \
              --assignee jeewooleebay0415
          fi

  scrape:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false        # 한 플랫폼이 실패해도 나머지는 계속
      matrix:
        platform: [musinsa, oy_global]
    defaults:
      run:
        working-directory: multi
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: multi/package-lock.json
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: 수집
        run: node src/runner.js --platform=${{ matrix.platform }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      - name: 실패 시 스크린샷 저장
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: multi-debug-${{ matrix.platform }}
          path: multi/debug/
          retention-days: 7

  # 국내 올리브영은 다시 긁지 않고, 기존 트래커가 매일 쌓는 raw_snapshots 최근 3일을 rk_snapshots 로 복사
  sync-oy-kr:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: multi
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: multi/package-lock.json
      - run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci
      - run: node src/backfill-oy-kr.js --days=3
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  # 무신사·글로벌 대시보드 페이지(musinsa.html / global.html) 생성 → 기존 GitHub Pages 사이트에 추가
  # 한 플랫폼 수집이 실패해도 쌓여 있는 데이터로 페이지는 갱신한다.
  pages:
    needs: [scrape]
    if: ${{ !cancelled() }}
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        working-directory: multi
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: multi/package-lock.json
      - run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci
      - name: 대시보드 페이지 생성
        run: node src/report.js --out=site
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      # keep_files: 국내 대시보드(index.html, data.html)는 그대로 두고 두 파일만 추가/교체
      - name: GitHub Pages 배포
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./multi/site
          publish_branch: gh-pages
          keep_files: true

  # 수집·페이지 job 이 하나라도 실패하면 바로 알림 이슈 (같은 날 중복 생성 방지)
  alert:
    needs: [scrape, sync-oy-kr, pages]
    if: failure()
    runs-on: ubuntu-24.04
    steps:
      - name: 실패 알림 이슈 생성
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="⚠️ [멀티] 랭킹 일일 수집 실패 ($(TZ=Asia/Seoul date +%Y-%m-%d))"
          if gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number' | grep -q .; then
            echo "이미 같은 날짜의 알림 이슈가 있음 — 건너뜀"
          else
            gh issue create --title "$TITLE" --body "자동 수집이 실패했습니다. 로그: $RUN_URL" --assignee jeewooleebay0415
          fi
