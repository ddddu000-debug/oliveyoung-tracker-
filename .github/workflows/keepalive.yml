name: Supabase Keepalive

# 스크래퍼와 독립적으로 Supabase를 주기적으로 핑해 7일 자동정지를 예방한다.
# (daily-scrape가 며칠 실패해도 이 워크플로우는 Playwright/올리브영과 무관하게 계속 동작)
on:
  schedule:
    - cron: '0 6 * * 1,4'   # 매주 월·목 UTC 06:00 (KST 15:00) — 최대 간격 ~4일 (< 7일 한도)
  workflow_dispatch:         # 버튼/수동 실행

permissions:
  contents: read
  issues: write

jobs:
  ping:
    runs-on: ubuntu-24.04   # ubuntu-latest는 OS가 예고 없이 바뀌어 수집이 멈춘 적이 있음(2026-10) → 버전 고정
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v5

      - name: Node.js 설치
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: 패키지 설치
        run: npm install

      - name: .env 파일 생성
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> .env

      - name: Supabase 핑
        run: node src/keepalive.js

      # 실패 알림 — 저장소에 이슈를 열어 소유자에게 메일/앱 알림이 가도록 함 (같은 날 중복 생성 방지)
      - name: 실패 알림 이슈 생성
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="⚠️ ${{ github.workflow }} 실패 ($(date -u +%Y-%m-%d))"
          if gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number' | grep -q .; then
            echo "이미 같은 날짜의 알림 이슈가 있음 — 건너뜀"
          else
            gh issue create --title "$TITLE" --body "자동 실행이 실패했습니다. 로그: $RUN_URL"
          fi
