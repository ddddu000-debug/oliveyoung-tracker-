name: 올리브영 랭킹 일일 수집

on:
  schedule:
    - cron: '0 0 * * *'   # 매일 오전 9시 (한국시간 = UTC 00:00)
  workflow_dispatch:        # 버튼 클릭으로 수동 실행도 가능

# GitHub Pages 배포 권한
permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  scrape:
    timeout-minutes: 60
    runs-on: ubuntu-24.04   # ubuntu-latest는 OS가 예고 없이 바뀌어 수집이 멈춘 적이 있음(2026-10) → 버전 고정
    steps:
      # 1. 코드 가져오기
      - name: 코드 체크아웃
        uses: actions/checkout@v5

      # 2. Node.js 설치
      - name: Node.js 설치
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      # 3. 패키지 설치
      - name: 패키지 설치
        run: npm install

      # 4. Playwright 브라우저 설치
      - name: Playwright 브라우저 설치
        run: npx playwright install chromium --with-deps

      # 5. 환경 변수 파일 생성 (Supabase + Google Sheets)
      - name: .env 파일 생성
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> .env
          echo "GOOGLE_SHEETS_ID=${{ secrets.GOOGLE_SHEETS_ID }}" >> .env
          echo "GOOGLE_APPLICATION_CREDENTIALS=google-credentials.json" >> .env

      # 6. Google 서비스 계정 인증 파일 생성
      - name: Google 인증 파일 생성
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > google-credentials.json

      # 7. 수집 실행
      - name: 랭킹 수집 실행
        run: node src/runner.js
        env:
          DASHBOARD_PATH: ./dashboard.html
          DATA_PAGE_PATH: ./data.html

      # 8. 생성된 dashboard.html / data.html을 docs/ 폴더로 복사
      - name: 대시보드 파일 준비
        if: ${{ !cancelled() && hashFiles('dashboard.html') != '' }}
        run: |
          mkdir -p docs
          cp dashboard.html docs/index.html
          cp data.html docs/data.html

      # 9. docs/ 폴더를 GitHub Pages에 배포
      - name: GitHub Pages 배포
        if: ${{ !cancelled() && hashFiles('dashboard.html') != '' }}
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages

      # 10. 실패 시 스크린샷 업로드 (디버깅용)
      - name: 실패 시 스크린샷 저장
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: debug/
          retention-days: 7

      # 실패 알림 — 저장소에 이슈를 열어 소유자에게 메일/앱 알림이 가도록 함 (같은 날 중복 생성 방지)
      - name: 실패 알림 이슈 생성
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="⚠️ ${{ github.workflow }} 실패 ($(date -u +%Y-%m-%d))"
          if gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number' | grep -q .; then
            echo "이미 같은 날짜의 알림 이슈가 있음 — 건너뜀"
          else
            gh issue create --title "$TITLE" --body "자동 실행이 실패했습니다. 로그: $RUN_URL"
          fi
