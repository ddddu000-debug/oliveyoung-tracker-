name: '[멀티] 사이트 구조 확인 (DB 저장 없음)'

# 랭킹 페이지를 열어 카테고리 탭과 데이터 구조만 기록한다. DB 에는 아무것도 쓰지 않는다.
on:
  workflow_dispatch:
  push:
    branches: [claude/multi-platform-tracker]
    paths: ['multi/**', '.github/workflows/multi-discover.yml']

permissions:
  contents: read

jobs:
  discover:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        platform: [musinsa, oy_global]
    defaults:
      run:
        working-directory: multi
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: multi/package-lock.json
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: node src/probe.js
        if: matrix.platform == 'oy_global'
      - run: node src/discover.js ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discover-${{ matrix.platform }}
          path: multi/discover-out/
          retention-days: 14
